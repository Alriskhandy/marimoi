<svg id="psn-svg" width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
                            <!-- Background -->
                            <defs>
                                <linearGradient id="nasionalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="&#10;                                            stop-color: #ff6b6b;&#10;                                            stop-opacity: 1;&#10;                                        "/>
                                    <stop offset="50%" style="&#10;                                            stop-color: #4ecdc4;&#10;                                            stop-opacity: 1;&#10;                                        "/>
                                    <stop offset="100%" style="&#10;                                            stop-color: #45b7d1;&#10;                                            stop-opacity: 1;&#10;                                        "/>
                                </linearGradient>
                                <linearGradient id="flagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" style="&#10;                                            stop-color: #ff0000;&#10;                                            stop-opacity: 1;&#10;                                        "/>
                                    <stop offset="100%" style="&#10;                                            stop-color: #dc143c;&#10;                                            stop-opacity: 1;&#10;                                        "/>
                                </linearGradient>
                            </defs>
                            <rect width="150" height="150" rx="18" fill="url(#nasionalGradient)"/>

                            <!-- Decorative circles -->
                            <circle cx="25" cy="25" r="15" fill="#FFFFFF" opacity="0.1"/>
                            <circle cx="125" cy="125" r="20" fill="#FFFFFF" opacity="0.1"/>

                            <!-- Flag pole with shadow -->
                            <line x1="30" y1="20" x2="30" y2="130" stroke="#8B4513" stroke-width="4"/>
                            <line x1="29" y1="21" x2="29" y2="131" stroke="#654321" stroke-width="1"/>

                            <!-- Indonesian Flag with 3D effect -->
                            <rect x="32" y="20" width="50" height="15" fill="url(#flagGradient)" rx="1"/>
                            <rect x="32" y="35" width="50" height="15" fill="#FFFFFF" rx="1"/>
                            <!-- Flag shadow -->
                            <rect x="33" y="21" width="48" height="1" fill="#000000" opacity="0.2"/>
                            <rect x="33" y="36" width="48" height="1" fill="#000000" opacity="0.1"/>

                            <!-- Peta Indonesia yang lebih akurat -->
                            <g transform="translate(90, 75)">
                                <!-- Laut -->
                                <ellipse cx="0" cy="0" rx="40" ry="25" fill="#4682B4" opacity="0.2"/>

                                <!-- Sumatra (bentuk memanjang vertikal) -->
                                <path d="M -25 -15 Q -23 -18 -20 -15 Q -18 -10 -17 -5 Q -19 0 -20 5 Q -22 10 -25 8 Q -27 3 -26 -2 Q -28 -8 -25 -15" fill="#228B22"/>

                                <!-- Jawa (bentuk memanjang horizontal) -->
                                <path d="M -10 8 Q 0 6 10 7 Q 20 8 25 10 Q 20 12 10 11 Q 0 10 -10 11 Q -12 9 -10 8" fill="#32CD32"/>

                                <!-- Kalimantan (bentuk kotak besar) -->
                                <path d="M -8 -15 Q 5 -18 12 -12 Q 15 -8 13 -2 Q 10 2 8 6 Q 5 8 0 6 Q -5 3 -8 -2 Q -10 -8 -8 -15" fill="#90EE90"/>

                                <!-- Sulawesi (bentuk seperti huruf K) -->
                                <path d="M 18 -8 Q 20 -12 22 -8 Q 24 -4 22 0 Q 25 2 23 6 Q 20 8 18 4 Q 16 6 14 2 Q 15 -2 18 -8" fill="#98FB98"/>

                                <!-- Papua (bentuk seperti kepala burung) -->
                                <path d="M 30 -5 Q 35 -8 40 -3 Q 38 0 35 2 Q 32 4 28 2 Q 26 -1 30 -5" fill="#00FF7F"/>

                                <!-- Bali (pulau kecil) -->
                                <circle cx="20" cy="12" r="1.5" fill="#ADFF2F"/>

                                <!-- Nusa Tenggara -->
                                <ellipse cx="25" cy="13" rx="3" ry="1" fill="#7CFC00"/>

                                <!-- Maluku (kepulauan kecil) -->
                                <circle cx="32" cy="2" r="1" fill="#00FA9A"/>
                                <circle cx="34" cy="0" r="0.8" fill="#00FA9A"/>
                            </g>

                            <!-- Garuda silhouette -->
                            <g transform="translate(25, 80)">
                                <path d="M 10 10 Q 5 5 0 10 Q 5 15 10 10 Q 15 5 20 10 Q 15 15 10 10" fill="#FFD700" opacity="0.8"/>
                                <circle cx="10" cy="8" r="1" fill="#FF6347"/>
                            </g>

                            <!-- Stars representing provinces -->
                            <g fill="#FFD700">
                                <polygon points="120,25 121,27 123,27 121.5,28.5 122,30.5 120,29 118,30.5 118.5,28.5 117,27 119,27" opacity="0.9"/>
                                <polygon points="110,45 111,47 113,47 111.5,48.5 112,50.5 110,49 108,50.5 108.5,48.5 107,47 109,47" opacity="0.8"/>
                                <polygon points="100,35 101,37 103,37 101.5,38.5 102,40.5 100,39 98,40.5 98.5,38.5 97,37 99,37" opacity="0.7"/>
                            </g>

                            <!-- Modern geometric elements -->
                            <rect x="15" y="110" width="20" height="3" fill="#FFFFFF" opacity="0.5" rx="1"/>
                            <rect x="115" y="115" width="25" height="2" fill="#FFFFFF" opacity="0.4" rx="1"/>

                            <!-- Ground with pattern -->
                            <defs>
                                <pattern id="groundPattern" patternUnits="userSpaceOnUse" width="4" height="4">
                                    <rect width="4" height="4" fill="#4169E1"/>
                                    <circle cx="2" cy="2" r="0.5" fill="#FFFFFF" opacity="0.3"/>
                                </pattern>
                            </defs>
                            <rect x="0" y="135" width="150" height="15" fill="url(#groundPattern)" rx="0"/>
                        </svg>