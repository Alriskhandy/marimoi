<svg id="psd-svg" width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
                            <!-- Background -->
                            <defs>
                                <linearGradient id="infraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="&#10;                                            stop-color: #ffb347;&#10;                                            stop-opacity: 1;&#10;                                        "/>
                                    <stop offset="100%" style="&#10;                                            stop-color: #ff8c00;&#10;                                            stop-opacity: 1;&#10;                                        "/>
                                </linearGradient>
                            </defs>
                            <rect width="150" height="150" rx="18" fill="url(#infraGradient)"/>

                            <!-- Buildings -->
                            <rect x="20" y="90" width="30" height="45" fill="#4A90E2" rx="3"/>
                            <rect x="100" y="85" width="30" height="50" fill="#5BA0F2" rx="3"/>

                            <!-- Building windows -->
                            <rect x="24" y="98" width="6" height="6" fill="#87CEEB" rx="1"/>
                            <rect x="34" y="98" width="6" height="6" fill="#87CEEB" rx="1"/>
                            <rect x="24" y="108" width="6" height="6" fill="#87CEEB" rx="1"/>
                            <rect x="34" y="108" width="6" height="6" fill="#87CEEB" rx="1"/>

                            <rect x="104" y="93" width="6" height="6" fill="#87CEEB" rx="1"/>
                            <rect x="114" y="93" width="6" height="6" fill="#87CEEB" rx="1"/>
                            <rect x="104" y="103" width="6" height="6" fill="#87CEEB" rx="1"/>
                            <rect x="114" y="103" width="6" height="6" fill="#87CEEB" rx="1"/>

                            <!-- Crane -->
                            <line x1="75" y1="35" x2="75" y2="115" stroke="#FFD700" stroke-width="4"/>
