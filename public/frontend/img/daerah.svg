                            <!-- Crane hook -->
                            <circle cx="95" cy="60" r="2" fill="#FFD700"/>
                            <line x1="95" y1="45" x2="95" y2="60" stroke="#FFD700" stroke-width="2"/>

                            <!-- Ground -->
