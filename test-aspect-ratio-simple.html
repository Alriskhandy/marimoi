<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 4:3 Aspect Ratio Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 375px;
            margin: 0 auto;
            padding: 20px;
            background: #f8fafc;
        }
        
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        /* 4:3 Aspect Ratio using padding-bottom technique */
        .aspect-ratio-4-3 {
            width: 100%;
            height: 0;
            padding-bottom: 75%; /* 4:3 = 3/4 = 75% */
            position: relative;
            background: #3b82f6;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .aspect-ratio-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        
        .test-info {
            margin-top: 10px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .measurement {
            font-weight: bold;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <h1>4:3 Aspect Ratio Test</h1>
    
    <div class="test-container">
        <h2>Test Element</h2>
        <div class="aspect-ratio-4-3" id="testElement">
            <div class="aspect-ratio-content">
                4:3 Aspect Ratio<br>
                <small>Should be 1.33 ratio</small>
            </div>
        </div>
        <div class="test-info" id="testInfo">
            Measuring...
        </div>
    </div>
    
    <div class="test-container">
        <h2>Test Results</h2>
        <div id="results">Loading...</div>
    </div>

    <script>
        function measureElement() {
            const element = document.getElementById('testElement');
            const rect = element.getBoundingClientRect();
            const ratio = rect.width / rect.height;
            const expected = 4/3;
            const tolerance = 0.05;
            const isCorrect = Math.abs(ratio - expected) <= tolerance;
            
            const info = document.getElementById('testInfo');
            info.innerHTML = `
                <div class="measurement">Width: ${Math.round(rect.width)}px</div>
                <div class="measurement">Height: ${Math.round(rect.height)}px</div>
                <div class="measurement">Ratio: ${ratio.toFixed(3)}</div>
                <div class="measurement">Expected: ${expected.toFixed(3)}</div>
                <div class="measurement" style="color: ${isCorrect ? 'green' : 'red'}">
                    Status: ${isCorrect ? 'PASS ✅' : 'FAIL ❌'}
                </div>
            `;
            
            const results = document.getElementById('results');
            results.innerHTML = `
                <div style="padding: 15px; border-radius: 8px; background: ${isCorrect ? '#dcfce7' : '#fef2f2'}; color: ${isCorrect ? '#166534' : '#dc2626'};">
                    <strong>${isCorrect ? 'SUCCESS!' : 'FAILED!'}</strong><br>
                    The 4:3 aspect ratio is ${isCorrect ? 'working correctly' : 'not working properly'}.<br>
                    <small>Ratio: ${ratio.toFixed(3)} (Expected: ${expected.toFixed(3)})</small>
                </div>
            `;
        }
        
        // Measure after page loads
        window.addEventListener('load', () => {
            setTimeout(measureElement, 100);
        });
        
        // Re-measure on resize
        window.addEventListener('resize', () => {
            setTimeout(measureElement, 100);
        });
    </script>
</body>
</html>
